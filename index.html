<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فال حافظ - نوروز</title>
    <style>
        @font-face {
            font-family: 'B Nazanin';
            src: url('https://cdn.fontcdn.ir/Font/Persian/B-Nazanin/B-Nazanin.eot');
            src: url('https://cdn.fontcdn.ir/Font/Persian/B-Nazanin/B-Nazanin.eot?#iefix') format('embedded-opentype'),
                 url('https://cdn.fontcdn.ir/Font/Persian/B-Nazanin/B-Nazanin.woff2') format('woff2'),
                 url('https://cdn.fontcdn.ir/Font/Persian/B-Nazanin/B-Nazanin.woff') format('woff'),
                 url('https://cdn.fontcdn.ir/Font/Persian/B-Nazanin/B-Nazanin.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'B Nazanin', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f7d794, #f3a683);
            color: #2d3436;
            padding: 1rem;
            text-align: center;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #e55039;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-family: 'B Nazanin', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #eb2f06;
        }

        #result {
            margin-top: 2rem;
            padding: 1rem;
            max-width: 600px;
            font-size: 18px;
            line-height: 1.8;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            font-family: 'B Nazanin', Tahoma, Geneva, Verdana, sans-serif;
            width: 90%;
        }

        #title {
            font-size: 24px;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 1rem;
        }

        #text {
            font-size: 18px;
            color: #2d3436;
        }

        .wishes {
            font-size: 18px;
            color: #e55039; /* Matching the button color */
            margin-top: 1.5rem;
            font-weight: bold;
        }

        .instruction {
            font-size: 16px;
            color: #2d3436;
            margin-top: 1rem;
            line-height: 1.6;
            max-width: 600px;
            width: 90%;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            button {
                font-size: 16px;
                padding: 10px 20px;
            }

            #result {
                font-size: 16px;
            }

            .instruction {
                font-size: 14px;
            }

            .wishes {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <button onclick="fetchInterpreter()">با نیت کلیک کنید</button>
    <div class="instruction">
         لطفا نیت کنید و اولین فال امسال خود را بگیرید، به امید خدا در سال جدید بهترین ها برای شما رخ می دهد. 🌸✨
    </div>
    <div id="result">
        <div id="title"></div>
        <div id="text"></div>
        <div class="wishes">علی و انسیه بهترین آرزوها رو واست دارند ❤️</div>
    </div>

    <script>
        async function fetchInterpreter() {
            const titleDiv = document.getElementById('title');
            const textDiv = document.getElementById('text');
            
            try {
                const response = await fetch('https://hafez-dxle.onrender.com/fal');
                const data = await response.json();
                
                // Display the title and text
                if (data.title && data.interpreter) {
                    titleDiv.textContent = data.title;
                    textDiv.textContent = data.interpreter;
                } else {
                    textDiv.textContent = 'متن فال در دسترس نیست. لطفاً دوباره تلاش کنید.';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                textDiv.textContent = 'خطا در دریافت فال. لطفاً دوباره تلاش کنید.';
            }
        }
    </script>
</body>
</html>
